apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
  labels:
    tier: my-app
spec:
  replicas: 3
  selector:
    matchLabels:
      tier: my-app
  template:
    metadata:
      labels:
        tier: my-app
    spec:
      containers:
      - name: my-container
        image: nginx:latest
        ports:
        - containerPort: 80