apiVersion: apps/v1
kind: Deployment   #specify what kind of resource you want to create
metadata:
  name: nginx-deployment # name of the deployment
  labels:
    app: nginx
spec:
  replicas: 2 #how many pods you want to run
  selector:
    matchLabels:
        app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec: #specify the pod template
      containers:
      - name: nginx
        image: nginx:1.31
        ports:
        - containerPort: 80