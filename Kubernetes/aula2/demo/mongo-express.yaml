apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongoexpress
  labels:
    app: mongoexpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongoexpress
  template:
    metadata:
      labels:
        app: mongoexpress
    spec:
      containers:
        - name: mongoexpress
          image: mongo-express:latest
          ports:
            - containerPort: 8081 #define the port that the container will listen on, default port for Mongo Express is 8081
          env:
              - name: ME_CONFIG_MONGODB_ADMINUSERNAME
                valueFrom:
                  secretKeyRef:
                    name: mongodb-secret
                    key: mongo-root-username
              - name: ME_CONFIG_MONGODB_ADMINPASSWORD
                valueFrom:
                  secretKeyRef:
                    name: mongodb-secret
                    key: mongo-root-password  
              - name: ME_CONFIG_MONGODB_SERVER
                valueFrom:
                  configMapKeyRef:
                    name: mongodb-configmap
                    key: database_url

---
#external service - to access the mongo-express web interface from outside the cluster
apiVersion: v1
kind: Service
metadata:
  name: mongo-express-service # name of the service
spec:
  selector:
    app: mongoexpress #to connect with the deployment, we need to specify the label of the deployment
  type: LoadBalancer #specify the type of service, LoadBalancer will expose the service
  ports:
    - protocol: TCP
      port: 8081 # define the port that the service will listen on, default port  
      targetPort: 8081 # define the port that the service will forward traffic to, which is the same as the container port
      nodePort: 30000 #define the port that the service will listen on the node, default port for Mongo Express is 30000
