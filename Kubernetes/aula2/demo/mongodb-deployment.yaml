apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-deployment
  labels:
    app: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:latest
          ports:
            - containerPort: 27017 #define the port that the container will listen on, default port for MongoDB is 27017
          env:
              - name: MONGO_INITDB_ROOT_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: mongodb-secret
                    key: mongo-root-username
              - name: MONGO_INITDB_ROOT_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: mongodb-secret
                    key: mongo-root-password

---
#use --- to separate multiple resources in a single YAML file

apiVersion: v1
kind: Service   #specify what kind of resource you want to create
metadata:
  name: mongodb-service # name of the service
spec:
  selector:
    app: mongodb #to connect with the deployment, we need to specify the label of the deployment
  ports:
    - protocol: TCP
      port: 27017 # define the port that the service will listen on, default port for MongoDB is 27017
      targetPort: 27017 # define the port that the service will forward traffic to, which is the same as the container port
