apiVersion: v1
kind: ReplicaSet
metadata:
  name: my-replicaset
  labels:
    tier: my-app
spec:
  replicas: 3 #quantas replicas, 3 pods no caso 
  selector: #seleciona os pods que pertencem a label tier=my-app
    matchLabels: 
      tier: my-app
  template: #configuraçao do pod, passamos o template do pod que queremos criar
    metadata:
      labels:
        tier: my-app
    spec:
      containers:
      - name: my-container
        image: nginx:latest
        ports:
        - containerPort: 80